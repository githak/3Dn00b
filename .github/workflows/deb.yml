name: debian-package

# Builds the .deb, installs it on clean Debian and Ubuntu systems, and runs the
# app's smoke test there. Pushing a tag like v0.10.0 also publishes it as a release.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the package
        run: python packaging/build_deb.py
      - uses: actions/upload-artifact@v4
        with:
          name: 3dn00b-deb
          path: dist/*.deb

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        system: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 3dn00b-deb
          path: dist
      - name: Install and run on ${{ matrix.system }}
        run: packaging/test_deb.sh dist/*.deb ${{ matrix.system }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: 3dn00b-deb
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb --repo "$GITHUB_REPOSITORY" \
            --title "3Dn00b $GITHUB_REF_NAME" \
            --notes "Install on Debian 12/13, Ubuntu 22.04 to 26.04 and later, Linux Mint 21/22: download the .deb and run: sudo apt install ./$(basename dist/*.deb)"
